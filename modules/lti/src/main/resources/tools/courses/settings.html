<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Series settings</title>

    <link rel="stylesheet" type="text/css" href="../shared/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="../shared/css/admin.css?v=%version%" />
    <link rel="stylesheet" type="text/css" href="../shared/css/lti.css?v=%version%" />
    <link rel="stylesheet" type="text/css" href="../shared/css/daterangepicker.css" />
    <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css" />
    <link href="css/lti.settings.css?v=%version%" rel="stylesheet" />
</head>

<body>
<div class="lti-outer">
    <div id="addHeader">
        <div class="lti_links">
            <ul>
                <li data-access="read"><a href="index.html?sid=%courseID%&upload=%upload%" style="font-weight: 300;">Recordings</a></li>
                <li data-access="write" data-page="manage"><a href="manage.html?sid=%courseID%&upload=%upload%&v=%version%">Manage</a></li>
                <li data-access="write" data-page="settings"><a class="active" href="settings.html?sid=%courseID%&upload=%upload%&v=%version%">Settings</a></li>
            </ul>
        </div>

        <div class="lti-oc-top-section">
            <div class="lti-oc-title">
                <h2>Series Settings</h2>
            </div>
        </div>
    </div>
    <div class="container" style="width: auto;">
        <div class="row">
            <div class="col-lg-8 col-md-8 col-sm-12">
                <form class="form-horizontal">
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="series_title">Title:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="series_title" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="series_creator">Series Creator:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="series_creator" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="notification_list">Notification list:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="notification_list" name="notification_list">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="series_captions">Captions:</label>
                        <div class="col-sm-10">
                            <select class="form-control" id="series_captions" name="series_captions">
                                <option value="no_selection">No option selected</option>
                                <option value="none">None</option>
                                <option value="google">Google Speech-to-Text</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="transcript_features">AI Features:</label>
                        <div class="col-sm-10" id="transcript_features_options">
                            <div class="row">
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="transcript" checked disabled> Transcript
                                    </label>
                                </div>
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="summary"> Summary
                                    </label>
                                </div>
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="key_points"> Key Points
                                    </label>
                                </div>
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="practice_questions"> Practice Questions
                                    </label>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="multiple_choice"> Multiple Choice
                                    </label>
                                </div>
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="audio_summary"> Audio Summary
                                    </label>
                                </div>
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="further_reading"> Further Reading
                                    </label>
                                </div>
                                <div class="col-sm-3">
                                    <label class="checkbox-inline">
                                        <input type="checkbox" class="form-check-input" value="study_notes"> Study Notes
                                    </label>
                                </div>
                            </div>
                        
                            <input type="hidden" class="form-control mt-2" id="transcript_features" name="transcript_features">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="series_retention">Retention cycle:</label>
                        <div class="col-sm-10">
                            <select class="form-control" id="series_retention" name="series_retention">
                                <option value="normal">Default (4 years)</option>
                                <option value="forever">Keep Forever</option>
                                <option value="long">Long (8 years)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="retain_date">Retain until:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="retain_date" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="control-label col-sm-2" for="locked_status">Lock series:</label>
                        <div class="col-sm-10">
                            <input type="text" class="form-control" id="locked_status" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="col-sm-offset-2 col-sm-10 text-right">
                            <button type="button" class="btn btn-success" id="save_button">Save</button>
                        </div>
                    </div>
                </form>
                <!-- Processing Modal -->
                <div class="modal fade" id="processingModal" tabindex="-1" role="dialog" aria-labelledby="processingModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered" role="document">
                        <div class="modal-content">
                            <div class="modal-body text-center">
                                <div id="processingContent">
                                    <i class="fa fa-spinner fa-spin fa-3x fa-fw"></i><br/><br/>
                                    <p>Processing your request...</p>
                                </div>
                                <div id="resultContent" style="display: none;">
                                    <p id="resultMessage"></p><br/>
                                    <button type="button" class="btn btn-primary" data-dismiss="modal">Close</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-12">
                <p>&nbsp;</p>
            </div>
        </div>
        <div id="suggestion">
        </div>
    </div>
</div>

<script type="text/javascript" src="../shared/js/jquery/jquery.min.js"></script>
<script type="text/javascript" src="../shared/js/jquery/plugins/jquery.utils.js"></script>
<script type="text/javascript" src="../shared/js/ext/moment.min.js"></script>
<script type="text/javascript" src="../shared/js/daterangepicker.js"></script>
<script type="text/javascript" src="../shared/js/he.js"></script>
<script type="text/javascript" src="../shared/js/underscore.js?v=%version%"></script>
<script type="text/javascript" src="../shared/js/bootstrap.js?v=%version%"></script>
<script type="text/javascript" src="../shared/js/lti.js?v=%version%"></script>

<script type="text/javascript" src="js/lti.settings.js?v=%version%"></script>
<link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i" rel="stylesheet">
</body>
</html>
