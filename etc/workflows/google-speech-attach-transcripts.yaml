id: google-speech-attach-transcripts
title: Attach caption/transcripts generated by Google Speech
description: Attach automated transcription generated by the Google speech service. 
  This is an internal workflow, started by the Transcription Service.
operations:
  # Attach caption/transcript
  - id: google-speech-attach-transcription
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Attach captions/transcription
    configurations:
      # his is filled out by the transcription service when starting this workflow
      -transcription-job-id: ${transcriptionJobId}
      -line-size: 80
      -target-flavor: captions/timedtext
      -target-tag: archive
      -target-caption-format: vtt

  # Publish to engage player
  - id: publish-engage
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Distribute and publish to engage server
    configurations:
      -download-source-flavors: dublincore/*,security/*,captions/*
      -strategy: merge
      -check-availability: false

  # Publish to oaipmh
  - id: republish-oaipmh
    exception-handler-workflow: partial-error
    description: Update recording metadata in default OAI-PMH repository
    configurations:
      -source-flavors: dublincore/*,security/*,captions/*
      -repository: default

  # Archive media package
  - id: snapshot
    fail-on-error: true
    exception-handler-workflow: partial-error
    description: Archive media package
    configurations:
      -source-flavors: '*/*'

  # Clean up work artifacts
  - id: cleanup
    fail-on-error: false
    description: Remove temporary processing artifacts
    configurations:
      -delete-external: true
      # FixMe Don't clean up ACLs until workflow service no longer looks for them in the WFR.
      -preserve-flavors: security/*
